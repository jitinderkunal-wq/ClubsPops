<div class="d-flex justify-content-center parentCard">
    <div class="card myCard">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="text-center mb-4">
                <h1 class="mb-5">Login</h1>
            </div>
            <div class="text-center mb-4">
                <p>Welcome back, Please enter your details to Continue</p>
            </div>
            <app-text-input [formControl]="loginForm.controls['email']" [label]="'Email'"></app-text-input>
            <app-text-input [formControl]="loginForm.controls['password']" [type]="'password'"
                [label]="'Password'"></app-text-input>
            <div class="d-grid">
                <button [disabled]="loginForm.invalid" type="submit" class="btn">Login</button>
            </div>
        </form>
    </div>
</div>
