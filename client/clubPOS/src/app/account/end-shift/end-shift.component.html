<div class="container model">
    <div class="col-12">
        <div class="row header">
            <div class="col-6">
                <h4 mat-dialog-title><b (click)="closePopup()">X</b>Employee End Of Shift</h4>
            </div>
        </div>
        <div class="row">
            <div class="col-8">
                <p>
                    <svg width="20" height="18" viewBox="0 0 31 31" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15.5 0C13.4645 0 11.449 0.400919 9.56841 1.17987C7.68786 1.95882 5.97915 3.10054 4.53984 4.53984C1.63303 7.44666 0 11.3891 0 15.5C0 19.6109 1.63303 23.5533 4.53984 26.4602C5.97915 27.8995 7.68786 29.0412 9.56841 29.8201C11.449 30.5991 13.4645 31 15.5 31C19.6109 31 23.5533 29.367 26.4602 26.4602C29.367 23.5533 31 19.6109 31 15.5C31 13.4645 30.5991 11.449 29.8201 9.56841C29.0412 7.68786 27.8995 5.97915 26.4602 4.53984C25.0208 3.10054 23.3121 1.95882 21.4316 1.17987C19.551 0.400919 17.5355 0 15.5 0ZM7.8585 25.234C8.525 23.839 12.586 22.475 15.5 22.475C18.414 22.475 22.475 23.839 23.1415 25.234C20.9705 26.9638 18.2759 27.904 15.5 27.9C12.617 27.9 9.9665 26.908 7.8585 25.234ZM25.358 22.9865C23.1415 20.2895 17.763 19.375 15.5 19.375C13.237 19.375 7.8585 20.2895 5.642 22.9865C3.99309 20.8392 3.09948 18.2074 3.1 15.5C3.1 8.6645 8.6645 3.1 15.5 3.1C22.3355 3.1 27.9 8.6645 27.9 15.5C27.9 18.321 26.939 20.925 25.358 22.9865ZM15.5 6.2C12.493 6.2 10.075 8.618 10.075 11.625C10.075 14.632 12.493 17.05 15.5 17.05C18.507 17.05 20.925 14.632 20.925 11.625C20.925 8.618 18.507 6.2 15.5 6.2ZM15.5 13.95C14.8834 13.95 14.292 13.705 13.856 13.269C13.42 12.833 13.175 12.2416 13.175 11.625C13.175 11.0084 13.42 10.417 13.856 9.98098C14.292 9.54495 14.8834 9.3 15.5 9.3C16.1166 9.3 16.708 9.54495 17.144 9.98098C17.58 10.417 17.825 11.0084 17.825 11.625C17.825 12.2416 17.58 12.833 17.144 13.269C16.708 13.705 16.1166 13.95 15.5 13.95Z"
                            fill="#F77600" />
                    </svg>
                    {{currentUser}} (Shift # : {{shiftNumber}})
                </p>
            </div>
            <div class="col-4">
                <p>
                    <svg width="20" height="18" viewBox="0 0 29 31" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M3.94943 31C3.08832 31 2.3509 30.6962 1.73716 30.0886C1.12342 29.481 0.817074 28.7515 0.818118 27.9V6.2C0.818118 5.3475 1.12499 4.61745 1.73872 4.00985C2.35246 3.40225 3.08936 3.09897 3.94943 3.1H5.51509V0H8.6464V3.1H21.1716V0H24.303V3.1H25.8686C26.7297 3.1 27.4672 3.4038 28.0809 4.0114C28.6946 4.619 29.001 5.34853 28.9999 6.2V27.9C28.9999 28.7525 28.6931 29.4825 28.0793 30.0901C27.4656 30.6977 26.7287 31.001 25.8686 31H3.94943ZM3.94943 27.9H25.8686V12.4H3.94943V27.9ZM3.94943 9.3H25.8686V6.2H3.94943V9.3Z"
                            fill="#F77600" />
                    </svg>
                    Business Day : {{dateToday | date:'fullDate'}}
                </p>
            </div>
        </div>
        <form [formGroup]="endShiftForm" (ngSubmit)="onSubmit()">
            <div class="row content">
                <div class="col-12">
                    <div class="row">
                        <div class="col-6">
                            <app-text-input [formControl]="endShiftForm.controls['finalCashDeposit']" 
                                [type]="'number'" [label]="'Final Cash Deposit'" (valueChange)="finalCashDeposit($event)"></app-text-input>
                        </div>
                        <div class="col-6">
                            <app-text-input [formControl]="endShiftForm.controls['finalDebitCredit']" 
                                [type]="'number'" [label]="'Final Debit & Credit'" (valueChange)="finalDebitCredit($event)"></app-text-input>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="row btns">
                        <div class="col-6">
                        <button type="button" [ngClass]="isDepositClicked?'btn btn-outline-primary':'btn btn-primary'" (click)="dispositeClicked()">Deposit Details</button>
                        </div>
                        <div class="col-6">
                        <button type="button" [ngClass]="isDebitCreditClicked?'btn btn-outline-primary':'btn btn-primary'" (click)="debitCreditClicked()">Debit and Credit Details</button>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="row">
                        <div class="col-12 tabs" *ngIf="isDepositClicked">
                            <h4>Deposit</h4>
                            <div class="mx-auto">
                                <app-text-input [formControl]="endShiftForm.controls['nickels']"
                                    [type]="'number'" [label]="'Nickels'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['nickels'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div class="mx-auto">
                                <app-text-input [formControl]="endShiftForm.controls['dimes']"
                                    [type]="'number'" [label]="'Dimes'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['dimes'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['quarters']"
                                    [type]="'number'" [label]="'Quarters'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['quarters'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty1Dollar']" [type]="'number'"
                                    [label]="'$1 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty1Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty2Dollar']" [type]="'number'"
                                    [label]="'$2 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty2Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty5Dollar']" [type]="'number'"
                                    [label]="'$5 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty5Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty10Dollar']" [type]="'number'"
                                    [label]="'$10 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty10Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty20Dollar']" [type]="'number'"
                                    [label]="'$20 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty20Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty50Dollar']" [type]="'number'"
                                    [label]="'$50 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty50Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['qty100Dollar']"
                                    [type]="'number'" [label]="'$100 X'" (valueChange)="finalCashDepositCalculation($event)" [ngClass]="(endShiftForm.controls['qty100Dollar'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                        </div>
                        <div *ngIf="!isDepositClicked && isDebitCreditClicked">
                            <app-text-input [formControl]="endShiftForm.controls['grandTotal']"
                                [type]="'number'" [label]="'Grand Total'" [ngClass]="('disabledInput')"
                                [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="row">
                        <div class="col-12 tabs" *ngIf="isDebitCreditClicked">
                            <h4>Debit & Credit</h4>
                            <div class="mx-auto">
                                <app-text-input [formControl]="endShiftForm.controls['debit']"
                                    [type]="'number'" [label]="'Debit'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['debit'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div class="mx-auto">
                                <app-text-input [formControl]="endShiftForm.controls['visa']"
                                    [type]="'number'" [label]="'VISA'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['visa'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['masterCard']"
                                    [type]="'number'" [label]="'Master Card'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['masterCard'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['amex']" [type]="'number'"
                                    [label]="'AMEX'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['amex'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['discover']" [type]="'number'"
                                    [label]="'Discover'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['discover'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['otherCreditCard']" [type]="'number'"
                                    [label]="'Other Credit Card'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['otherCreditCard'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['usDollars']" [type]="'number'"
                                    [label]="'US Dollars'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['usDollars'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['euroDollars']" [type]="'number'"
                                    [label]="'Euro Dollars'" (valueChange)="finalDebitCreditCalculation($event)" [ngClass]="(endShiftForm.controls['euroDollars'].touched?'disabledInput':null)"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['debitCreditTotal']" [type]="'number'"
                                    [label]="'Debit Credit Total'" [ngClass]="('disabledInput')"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                            <div>
                                <app-text-input [formControl]="endShiftForm.controls['grandTotal']"
                                    [type]="'number'" [label]="'Grand Total'" [ngClass]="('disabledInput')"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                        </div>
                        <div *ngIf="!isDebitCreditClicked && isDepositClicked">
                            <app-text-input [formControl]="endShiftForm.controls['grandTotal']"
                                [type]="'number'" [label]="'Grand Total'" [ngClass]="('disabledInput')"
                                [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="row">
                        <div class="col-3"></div>
                        <div class="col-6">
                            <div *ngIf="!isDepositClicked && !isDebitCreditClicked">
                                <app-text-input [formControl]="endShiftForm.controls['grandTotal']"
                                    [type]="'number'" [label]="'Grand Total'" [ngClass]="('disabledInput')"
                                    [customStyles]="{'display': 'flex', 'justify-content': 'space-between', 'height':'15px'}"></app-text-input>
                            </div>
                        </div>
                        <div class="col-3"></div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="footer">
                        <button mat-dialog-close type="button" class="btn"
                            style="color: #F67600;background-color: black" (click)="closePopup()">Cancel</button>
                        <button type="submit" class="btn btn-warning">End Shift</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
