<div class="container model" *ngIf="accommodationWithTypeAndStatus">
    <div class="col-12">
        <div class="row">
            <div class="col-12">
                <h1 mat-dialog-title>Front End Maintenance Resolution</h1>
                <p>{{accommodationWithTypeAndStatus.typeName}} : # {{accommodationWithTypeAndStatus.number}}</p>
            </div>
        </div>
        <div class="row" *ngIf="maintenanceLogDetailsNotResolved">
            <div mat-dialog-content class="content">
                <div class="tabs">
                    <div class="col-12">
                        <div class="row tb">
                            <div class="col-2" *ngFor="let maintenanceLogDetail of maintenanceLogDetailsNotResolved">
                                <button (click)="onMaintenanceTaskNotResolvedClick(maintenanceLogDetail)"
                                    [ngClass]="{'selected': maintenanceTaskIdsToResolve.includes(maintenanceLogDetail.maintenanceTaskId)}"
                                    [disabled]="maintenanceTaskIdsToResolve.includes(maintenanceLogDetail.maintenanceTaskId)">{{maintenanceLogDetail.taskName}}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <div class="row">
                    <h6>Out of Service Comment</h6>
                    <div class="comment">
                        <span>{{accommodationWithTypeAndStatus.lastMaintenanceLog?.comment}}</span>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="row">
                    <form [formGroup]="clearMaintenanceLogForm" (ngSubmit)="onSubmit()">
                        <h6>Resolution Comment</h6>
                        <div class="comment">
                            <textarea type="text" formControlName="resolveComment" matInput
                                placeholder="Ex. Put Resolution Comment" rows="3"></textarea>
                        </div>
                        <div mat-dialog-actions class="btn-group">
                            <button type="button" class="btn" (click)="closePopup()">Cancel</button>
                            <button type="submit" class="btn btn-save">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
