<div class="container model">
    <div class="col-12">
        <div class="row header">
            <div class="col-6">
                <h4 mat-dialog-title><b (click)="closePopup()">X</b>Accommodation Status Setup</h4>
            </div>
            <div class="col-6">
            </div>
        </div>
        <form [formGroup]="accommodationStatusForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-5">
                    <app-dropdown [formControl]="accommodationStatusForm.controls['accommodationStatusId']"
                        [options]="accommodationStatuses" label="Select Accommodation Status" [valueProperty]="'accommodationStatusId'"
                        [labelProperty]="'statusName'" (valueChange)="onAccommodationStatusChange($event)">
                    </app-dropdown>
                </div>
            </div>
            <div class="row content">
                <div class="col-6">
                    <div class="row">
                        <div class="col-12">
                            <app-text-input [formControl]="accommodationStatusForm.controls['statusName']"
                                [label]="'Accommodation Status Name'"></app-text-input>
                        </div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="row">
                        <div class="col-6">
                            <app-checkbox [formControl]="accommodationStatusForm.controls['isActive']"
                                [label]="'Is Active'"></app-checkbox>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="footer">
                        <button mat-dialog-close type="button" class="btn"
                            style="color: #F67600;background-color: black" (click)="closePopup()">Cancel</button>
                        <button type="submit" class="btn btn-warning">{{saveButtonText}}</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
