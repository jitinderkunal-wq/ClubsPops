<div class="container model">
    <div class="col-12">
        <div class="row header">
            <div class="col-6">
                <h4 mat-dialog-title><b (click)="closePopup()">X</b>Maintenance Tasks Setup</h4>
            </div>
        </div>
        <form [formGroup]="maintenanceTaskSetupForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-5">
                    <app-dropdown [formControl]="maintenanceTaskSetupForm.controls['maintenanceTaskId']"
                        [options]="maintenanceTasks" label="Select Maintenance Task"
                        [valueProperty]="'maintenanceTaskId'" [labelProperty]="'taskName'"
                        (valueChange)="onMaintenanceTaskChange($event)">
                    </app-dropdown>
                </div>
            </div>
            <div class="row content">
                <div class="col-12">
                    <div class="row">
                        <div class="col-6">
                            <div class="mtSet">
                                <label>Maintenance Task ID</label>
                                <p>{{maintenanceTaskCreateId}}</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="col-12">
                                <app-text-input [formControl]="maintenanceTaskSetupForm.controls['taskName']"
                                    [label]="'Task Name'"></app-text-input>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="row">
                        <div class="col-6">
                            <app-checkbox [formControl]="maintenanceTaskSetupForm.controls['isEndUserFixable']"
                                [label]="'Is End User Fixable'"></app-checkbox>
                        </div>
                        <div class="col-6">
                            <app-checkbox [formControl]="maintenanceTaskSetupForm.controls['isActive']"
                                [label]="'Is Active'"></app-checkbox>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="footer">
                        <button mat-dialog-close type="button" class="btn"
                            style="color: #F67600;background-color: black" (click)="closePopup()">Cancel</button>
                        <button type="submit" class="btn btn-warning">{{saveButtonText}}</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
