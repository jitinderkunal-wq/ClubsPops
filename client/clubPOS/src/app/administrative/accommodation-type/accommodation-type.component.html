<div class="container model">
    <div class="col-12">
        <div class="row header">
            <div class="col-6">
                <h4 mat-dialog-title><b (click)="closePopup()">X</b>Accommodation Types Setup</h4>
            </div>
            <div class="col-6">
            </div>
        </div>
        <form [formGroup]="accommodationTypeForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-5">
                    <app-dropdown [formControl]="accommodationTypeForm.controls['accommodationTypeId']"
                        [options]="accommodationTypes" label="Select Accommodation Type" [valueProperty]="'accommodationTypeId'"
                        [labelProperty]="'typeName'" (valueChange)="onAccommodationTypeChange($event)">
                    </app-dropdown>
                </div>
            </div>
            <div class="row content">
                <div class="col-6">
                    <div class="row">
                        <div class="col-12">
                            <app-text-input [formControl]="accommodationTypeForm.controls['typeName']"
                                [label]="'Accommodation Type Name'"></app-text-input>
                            <app-text-input [formControl]="accommodationTypeForm.controls['maxOccupants']"
                                [type]="'number'" [label]="'Max Occupants'"></app-text-input>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="row">
                        <div class="col-12">
                            <app-text-input [formControl]="accommodationTypeForm.controls['compatibilityValue']"
                                [type]="'number'" [label]="'Compatibility'"></app-text-input>
                            <app-checkbox [formControl]="accommodationTypeForm.controls['isActive']"
                                [label]="'Is Active'"></app-checkbox>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="footer">
                        <button mat-dialog-close type="button" class="btn"
                            style="color: #F67600;background-color: black" (click)="closePopup()">Cancel</button>
                        <button type="submit" class="btn btn-warning">{{saveButtonText}}</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
