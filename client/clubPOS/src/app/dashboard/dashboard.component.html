<div class="container-fluid dashboard" *ngIf="currentUser">
    <div class="col-12">
        <div class="row header">
            <div class="col-4"></div>
            <div class="col-4">
                <h1 class="label">Choose Section</h1>
            </div>
            <div class="col-4">
                <div class="row logoutbtn">
                    <div class="col-md-12" style="text-align: center;" *ngIf="accountService.currentUser$ | async as user">
                        <button (click)="accountService.logout()" class="fa fa-sign-out" aria-hidden="true">
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row cards">
        <div class="col-4 card">                                                                        <!-- *ngIf="currentUser.roles.includes('FrontCash')" -->
            <a (click)="openFrontOfHouseModule()">
                <img src="../../assets/img/front_of_house.png">
                <p>Front of House</p>
            </a>
        </div>
        <div class="col-4 card">       
            <!-- Why not make it Keeper -->
            <a (click)="openCleaningModule()">
                <img src="../../assets/img/cleaning.png">
                <p>Cleaning</p>
            </a>
        </div>
        <div class="col-4 card">
            <a (click)="openMaintenanceModule()">
                <img src="../../assets/img/maintenance.png">
                <p>Maintenance</p>
            </a>
        </div>
    </div>

    <div class="row cards">
        <div class="col-4 card">
            <a (click)="openAdministrativeModule()">
                <img src="../../assets/img/administrative.png">
                <p>Administrative</p>
            </a>
        </div>
    </div>
</div>

<div class="not-loged-in" *ngIf="currentUser == null">
    <p>You need to login</p>
</div>
